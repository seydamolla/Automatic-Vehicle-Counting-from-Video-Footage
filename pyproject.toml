[project]
name = "visionflow-vehicle-counter"
version = "0.2.0"
description = "YOLO and ByteTrack based vehicle counting web application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "imageio-ffmpeg>=0.6,<1",
  "lap>=0.5.12,<1",
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "pandas>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "ultralytics>=8.4,<9",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "black>=24.10,<26",
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
visionflow = "vehicle_counter.app:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=vehicle_counter --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = ["src/vehicle_counter/app.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["cv2", "ultralytics", "uvicorn"]
ignore_missing_imports = true

